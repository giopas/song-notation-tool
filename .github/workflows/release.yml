name: release

# On a version tag: build the native-window app for macOS (Apple silicon and
# Intel), Windows and Linux, smoke-test each build, and attach the files and
# SHA256SUMS to a draft GitHub release whose text is that version's
# CHANGELOG.md section. Publishing the draft is a manual step, and only a
# published release is offered by "Update and restart".
# Running from sources is not affected. Adapted from QLC+ Swiss Knife.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        label: macos-arm64 }   # GitHub retired the macOS 14 runner in November 2026
          - { os: macos-15-intel,  label: macos-x86_64 }
          - { os: windows-latest,  label: windows-x64 }
          - { os: ubuntu-22.04,    label: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pywebview certifi pyinstaller pytest
        shell: bash
      - name: Tests
        run: python -m pytest -q
        shell: bash
      - name: Build
        run: pyinstaller --noconfirm packaging/songnotation.spec
        shell: bash
      - name: Smoke test the bundle
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            macos-*)   EXE="dist/Song Notation Tool.app/Contents/MacOS/Song Notation Tool" ;;
            windows-*) EXE="dist/Song Notation Tool/Song Notation Tool.exe" ;;
            linux-*)   EXE="dist/Song-Notation-Tool/Song-Notation-Tool" ;;
          esac
          "$EXE" --smoke
      - name: Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
        shell: bash
      - name: Pack
        run: python packaging/make_archive.py
        shell: bash
      - name: Test the Windows installer (silent install, start, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'snt-install'
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          $p = Start-Process "$dir\Song Notation Tool.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test of the installed app failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT' -Wait
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: release/Song-Notation-Tool-*

  publish:
    needs: build
    # Only when every system built: a release with one download missing looks
    # complete, and Update and restart then finds nothing for that computer.
    # After a failed build, "Re-run failed jobs" builds it again and this
    # job runs then.
    if: ${{ needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum Song-Notation-Tool-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release, titled and written from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # "v0.33.0 (Parts in tab or free text)" and that version's section
          TITLE="$(python3 tools/release_notes.py "$TAG" --out notes.md)"
          cat notes.md
          # Hidden while the files go up, so the update check never offers a
          # release whose download is not there yet; then published.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TITLE" --notes-file notes.md
          fi
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
